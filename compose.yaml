services:
  ntv-allocator:
    image: ghcr.io/d4rkm3ch/ntv-allocator:latest
    container_name: ntv-allocator
    restart: unless-stopped
    user: ${PUID}:${PGID}
    ports:
      - 19860:19860             # status page: http://<nas>:19860
    environment:
      - TZ=Australia/Sydney
      # Plex
      - PLEX_URL=http://172.16.0.2:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      # NostalgiaTV (leave the login blank if Configure has no login set)
      - NTV_URL=http://172.16.0.2:19850
      - NTV_USERNAME=${NTV_USERNAME:-}
      - NTV_PASSWORD=${NTV_PASSWORD:-}
      - NTV_API_KEY=${NTV_API_KEY:-}
      # Discord
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - DISCORD_ALLOWED_USER_IDS=${DISCORD_ALLOWED_USER_IDS:-}
      # Behaviour
      - SCAN_INTERVAL_MINUTES=15
      - LOOKBACK_DAYS=35
      - REASK_DAYS=30           # a skipped title is asked about again after this many days
      - CLEANUP=true            # ask in Discord to remove titles deleted from Plex
      - CLEANUP_MAX_REMOVALS=50 # more missing at once = pause and warn instead of asking
      - DRY_RUN=false           # true = post what it would do without changing anything
      - ALERT_AFTER_FAILURES=3  # failed checks in a row before a Discord alert (1 minute apart)
      - ALERT_REMIND_HOURS=6    # reminder while a problem lasts
      - STATUS_PORT=19860
      - LOG_LEVEL=INFO
    volumes:
      - /mnt/Swimming/Sandboxes/docker/ntv-allocator/config:/config
      - /mnt/Swimming/Sandboxes/docker/ntv-allocator/data:/data
networks: {}
